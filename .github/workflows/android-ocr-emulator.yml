name: Offline OCR Android emulator smoke tests

# Real Android execution is intentionally separate from APK publishing.
# This suite checks bundled Russian/Kazakh models without a camera device.
on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/super-notes-stability-20261025
    paths:
      - 'android-overlay/app/src/androidTest/**'
      - '.github/workflows/android-ocr-emulator.yml'
      - 'android-overlay/app/src/main/java/app/lovable/supernotes/OfflineCyrillicOcrPlugin.java'
      - 'scripts/prepare-ocr-models.sh'

permissions:
  contents: read

jobs:
  emulator:
    name: Android 34 — bundled OCR engine integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Generate Android app with bundled OCR models
        run: |
          set -euo pipefail
          bun install
          bun run build
          bash scripts/prepare-ocr-models.sh
          npx cap add android
          npx cap sync android
          cp -R android-overlay/app/src/main/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/assets
          cp -R android-overlay/app/src/main/assets/. android/app/src/main/assets/
          cp -R android-overlay/app/src/main/java/. android/app/src/main/java/
          mkdir -p android/app/src/androidTest
          cp -R android-overlay/app/src/androidTest/. android/app/src/androidTest/
          cp android-overlay/app/build.gradle android/app/build.gradle
          cp android-overlay/app/proguard-rules.pro android/app/proguard-rules.pro
          cp android-overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-overlay/variables.gradle android/variables.gradle
          if test -f android/app/src/main/res/values/ic_launcher_background.xml &&
             grep -q 'ic_launcher_background' android/app/src/main/res/values/colors.xml; then
            rm android/app/src/main/res/values/ic_launcher_background.xml
          fi
          test -s android/app/src/main/assets/tessdata/rus.traineddata
          test -s android/app/src/main/assets/tessdata/kaz.traineddata
          chmod +x android/gradlew

      - name: Android instrumented OCR tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Summarize device-level verification
        if: always()
        run: |
          echo "## Android OCR integration" >> "$GITHUB_STEP_SUMMARY"
          echo "Executed or attempted Tesseract rus/kaz on an Android 34 emulator." >> "$GITHUB_STEP_SUMMARY"
          echo "This does NOT cover real camera/gallery or physical devices." >> "$GITHUB_STEP_SUMMARY"
