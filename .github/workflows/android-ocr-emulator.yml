name: Offline OCR Android emulator smoke tests

# Real Android execution is intentionally separate from APK publishing.
# This suite checks bundled Russian/Kazakh models without a camera device.
on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/super-notes-stability-20261025
    paths:
      - 'android-overlay/app/src/androidTest/**'
      - 'android-overlay/app/build.gradle'
      - '.github/workflows/android-ocr-emulator.yml'
      - 'android-overlay/app/src/main/java/app/lovable/supernotes/OfflineCyrillicOcrPlugin.java'
      - 'scripts/prepare-ocr-models.sh'
      # OCR web changes must also be checked in a real Android emulator.
      - 'src/lib/ocr-*.ts'
      - 'src/routes/camera.tsx'
      - 'src/lib/notes-store.ts'
      - 'scripts/test-ocr-*.ts'
      - 'package.json'
      - 'bun.lock'
      - 'android-overlay/app/src/main/AndroidManifest.xml'
      - 'android-overlay/app/src/main/java/app/lovable/supernotes/MainActivity.java'
      - 'android-overlay/app/src/main/java/app/lovable/supernotes/SystemUiInsets.java'
      - 'src/lib/native-shell.ts'
      - 'src/routes/__root.tsx'
      - 'src/components/BottomNav.tsx'
      - 'src/styles.css'
      - 'scripts/run-android-emulator-tests.sh'
      - 'scripts/write-capacitor-index.mjs'
      - 'src/routes/editor.$id.tsx'
      - 'src/routes/pdf.$id.tsx'
      - 'src/routes/settings.tsx'
      - 'src/lib/folders-store.ts'
      - 'src/lib/backup.ts'
      - 'src/lib/audio-files.ts'
      - 'src/lib/pdf-fonts.ts'
      - 'android-overlay/app/src/main/java/app/lovable/supernotes/FeedbackEmailPlugin.java'
      - 'capacitor.config.json'

permissions:
  contents: read

concurrency:
  group: super-notes-ocr-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Android ${{ matrix.api-level }} (${{ matrix.display-size }}, ${{ matrix.display-density }} dpi) — OCR and layout
    strategy:
      fail-fast: false
      matrix:
        # Screen profiles cover compact phones, taller OLEDs and tablets.
        # Android insets are measured at runtime; no device-name whitelist.
        include:
          - api-level: 24
            display-size: 320x568
            display-density: 160
          - api-level: 26
            display-size: 360x740
            display-density: 180
          - api-level: 29
            display-size: 393x851
            display-density: 210
          - api-level: 34
            display-size: 412x915
            display-density: 210
          - api-level: 34
            display-size: 800x1280
            display-density: 160
          - api-level: 36
            display-size: 480x1024
            display-density: 240
            # Use the same emulator profile as the earlier fully successful run.
          - api-level: '37.0'
            display-size: 1080x2400
            display-density: 420
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android-overlay/app/build.gradle
            android-overlay/variables.gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # The emulator runner requires /dev/kvm access for hardware acceleration.
      - name: Enable KVM acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "KVM unavailable on runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Cache verified build-time OCR language files
        uses: actions/cache@v4
        with:
          path: android-overlay/app/src/main/assets/tessdata
          key: supernotes-tessdata-87416418657359cb625c412a48b6e1d6d41c29bd-git-verified

      - name: Generate Android app with bundled OCR models
        run: |
          set -euo pipefail
          bun install
          node scripts/patch-admob-native-layout.mjs
          node scripts/verify-admob-native-layout.mjs
          bun run build
          bash scripts/prepare-ocr-models.sh
          npx cap add android
          npx cap sync android
          cp -R android-overlay/app/src/main/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/assets
          cp -R android-overlay/app/src/main/assets/. android/app/src/main/assets/
          cp -R android-overlay/app/src/main/java/. android/app/src/main/java/
          # Capacitor generates a sample instrumented test with a generic package
          # expectation. It is not a Wave Notes test and fails even when OCR passes.
          rm -f android/app/src/androidTest/java/com/getcapacitor/myapp/ExampleInstrumentedTest.java
          mkdir -p android/app/src/androidTest
          cp -R android-overlay/app/src/androidTest/. android/app/src/androidTest/
          cp android-overlay/app/build.gradle android/app/build.gradle
          cp android-overlay/app/proguard-rules.pro android/app/proguard-rules.pro
          cp android-overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-overlay/variables.gradle android/variables.gradle
          if test -f android/app/src/main/res/values/ic_launcher_background.xml &&
             grep -q 'ic_launcher_background' android/app/src/main/res/values/colors.xml; then
            rm android/app/src/main/res/values/ic_launcher_background.xml
          fi
          test -s android/app/src/main/assets/tessdata/rus.traineddata
          test -s android/app/src/main/assets/tessdata/kaz.traineddata
          chmod +x android/gradlew

          # Only Android instrumentation test classpaths: old Cordova test
          # dependencies include Kotlin 1.6 jdk7/jdk8 duplicates, while the
          # generated app already contains consolidated Kotlin stdlib 1.8.
          # Do not change the actual APK runtime dependencies or app overlay.
          cat >> android/build.gradle <<'GRADLE'
          subprojects {
              configurations.configureEach { configuration ->
                  if (configuration.name.toLowerCase().contains('androidtest')) {
                      configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                      configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  }
              }
          }
          GRADLE

      - name: Compile Android instrumentation APK before starting emulator
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Verify single-process Android runner syntax
        run: bash -n scripts/run-android-emulator-tests.sh

      - name: Android instrumented OCR tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 17 requires android-37.0 platform AND system image.
          # The '37' package id fails before booting an emulator.
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          # On Android 8, 'svc wifi disable' aborts with exit 137 and
          # AIRPLANE_MODE broadcasts are denied to the shell. Offline tests
          # should not be blocked by those device-management commands.
          # These tests no longer assert device network isolation. Bundled
          # model integrity is checked, while offline mode remains a separate
          # acceptance requirement; do not claim it passed from this workflow.
          # The action executes each script line as an individual /bin/sh -c call.
          # Keep invocation on ONE line; control-flow belongs inside the bash file.
          script: 'bash scripts/run-android-emulator-tests.sh "${{ matrix.api-level }}" "${{ matrix.display-size }}" "${{ matrix.display-density }}"'

      - name: Upload Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wave-android-debug-${{ matrix.api-level }}-${{ matrix.display-size }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            android-test-diagnostics/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/

      - name: Record actual Android OCR instrumentation results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          import os
          reports = list(Path('android/app/build/outputs/androidTest-results').rglob('*.xml'))
          suites = []
          for path in reports:
              try:
                  root = ElementTree.parse(path).getroot()
              except ElementTree.ParseError:
                  continue
              if root.tag == 'testsuite':
                  suites.append(root)
              suites.extend(root.findall('.//testsuite'))
          cases = [case for suite in suites for case in suite.findall('testcase')]
          failures = [case for case in cases if case.find('failure') is not None or case.find('error') is not None]
          names = [case.attrib.get('name','') for case in cases]
          path = os.environ['GITHUB_STEP_SUMMARY']
          with open(path,'a',encoding='utf-8') as out:
              out.write("## Android OCR emulator API ${{ matrix.api-level }} — observed results\n\n")
              out.write(f"- Tests recorded: **{len(cases)}**\n")
              out.write(f"- Failed: **{len(failures)}**\n")
              out.write("- These are synthetic Android Canvas images, not camera photographs.\n")
              for name in names:
                  out.write(f"  - {name}\n")
              if not cases:
                  out.write("- **No runnable test results found; no Android success may be claimed.**\n")
          print(f"Android tests recorded={len(cases)}, failures={len(failures)}")
          PY
